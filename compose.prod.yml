# ---------------------------------------------------------------------------
# Production compose file for Coolify.
#
# Differences from the local docker-compose.yml:
#   - Builds from Dockerfile.prod, not ./Dockerfile (which serves local runs
#     via docker-compose.yml).
#   - No published ports. Coolify's Traefik proxy reaches the container over
#     the shared network, so only `expose` is needed. Publishing 3000 on the
#     host would collide with every other app on the VPS.
#   - No container_name. Coolify derives its own name per deployment; a fixed
#     one breaks zero-downtime redeploys and multi-environment setups.
#   - NEXT_PUBLIC_SITE_URL is a build arg. Next.js inlines NEXT_PUBLIC_* into
#     the client bundle at build time, so setting it only at runtime has no
#     effect on metadataBase or any emitted URL.
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # SERVICE_FQDN_WEB_3000 is generated by Coolify from the domain you
        # assign to this service. Override by setting NEXT_PUBLIC_SITE_URL
        # explicitly in Coolify > Environment Variables.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${SERVICE_FQDN_WEB_3000:-http://localhost:3000}}
        # Note: Coolify also passes --build-arg NEXT_PUBLIC_SITE_URL from its
        # own env file, and a CLI build arg wins over this default. Set the
        # value under Environment Variables (Build Variable enabled) so it is
        # never handed over empty.

    restart: unless-stopped

    # Mapping syntax, not a list. Coolify merges its own variables into this
    # block and re-serialises it; a YAML sequence comes back out as a map keyed
    # by list index, which docker compose rejects with
    # "non-string key in services.web.environment: 0".
    environment:
      # Declaring this magic variable tells Coolify to allocate a domain for
      # service `web` on port 3000 and wire up the proxy + TLS certificate.
      # Empty value means "inherit whatever Coolify generates".
      SERVICE_FQDN_WEB_3000: ''
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'

    expose:
      - '3000'

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

    # The app holds no server-side state: no database, no uploads, no sessions.
    # The container is fully disposable, so the root filesystem stays read-only
    # and the only writable paths are scratch space.
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      # Next.js writes its runtime fetch cache here even with no ISR routes.
      - /app/.next/cache:mode=0777

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
