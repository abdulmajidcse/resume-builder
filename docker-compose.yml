services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: inkwell-resume-builder:latest
    container_name: inkwell
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # The app holds no server-side state, so the container is fully disposable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
